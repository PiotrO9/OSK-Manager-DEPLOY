name: Homelab deploy

on:
  push:
    branches:
      - main
    paths:
      - compose.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, homelab, deploy]

    steps:
      - name: Print runner info
        run: |
          hostname
          whoami
          pwd

      - name: Update backend repository
        run: |
          cd /srv/apps/OSK-Manager/BE
          git pull --ff-only

      - name: Update frontend repository
        run: |
          cd /srv/apps/OSK-Manager/FE/OSK-Manager-FE
          git pull --ff-only

      - name: Update deploy repository
        run: |
          cd /srv/apps/OSK-Manager/deploy
          git pull --ff-only

      - name: Run database migrations
        run: |
          cd /srv/apps/OSK-Manager/deploy
          docker compose --profile postgres --profile migrate run --rm api-migrations

      - name: Rebuild and restart containers
        run: |
          cd /srv/apps/OSK-Manager/deploy
          docker compose --profile postgres up -d --build

      - name: Show container status
        run: |
          cd /srv/apps/OSK-Manager/deploy
          docker compose --profile postgres ps

      - name: Check backend health
        run: |
          cd /srv/apps/OSK-Manager/deploy
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:3001/health; then
              exit 0
            fi
            echo "Backend not ready yet, retry $i/30..."
            sleep 2
          done

          docker compose --profile postgres logs api --tail=100
          exit 1

      - name: Check backend smoke endpoint
        run: |
          cd /srv/apps/OSK-Manager/deploy
          curl --fail --silent --show-error http://localhost:3001/test

      - name: Check frontend response
        run: |
          cd /srv/apps/OSK-Manager/deploy
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:3000 > /dev/null; then
              exit 0
            fi
            echo "Frontend not ready yet, retry $i/30..."
            sleep 2
          done

          docker compose --profile postgres logs frontend --tail=100
          exit 1
