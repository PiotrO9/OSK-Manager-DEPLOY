services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osk_manager}
      POSTGRES_USER: ${POSTGRES_USER:-osk_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-generate-a-strong-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-osk_manager} -d ${POSTGRES_DB:-osk_manager}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/piotro9/osk-manager-api:latest
    restart: unless-stopped
    env_file:
      - ../BE/.env
    ports:
      - "3001:3001"

  api-migrations:
    build:
      context: ../BE
      target: build
    profiles:
      - migrate
    env_file:
      - ../BE/.env
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/piotro9/osk-manager-frontend:latest
    restart: unless-stopped
    env_file:
      - ../FE/OSK-Manager-FE/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
